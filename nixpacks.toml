
# Nixpacks phases override。讓 install/build 都在 web/ 子目錄,
# 跳過根目錄 package.json(那是 ghost CLI / 測試工具,runtime 用不到)。

[phases.setup]
nixPkgs = ["nodejs_22", "npm-10_x"]

[phases.install]
# 根目錄 npm ci 是為了讓 ../src/ 的 jszip / @anthropic-ai/sdk 在 TS 跟 runtime 都能解析。
# --omit=dev 跳過 vitest / tsx 等 CLI 工具,只裝 src/ 需要的兩個 runtime dep。
cmds = [
  "npm ci --omit=dev",
  "cd web && npm ci"
]

[phases.build]
cmds = ["cd web && npm run build"]

[start]
cmd = "cd web && npm run start -- -p $PORT -H 0.0.0.0"
